<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma hídrica · Universidad Central</title>
<style>
:root{--bg:#F5F0E1;--pn:#FFFDF7;--ink:#1D1E16;--mu:#6C6B58;--sb:#33401B;--ac:#586A33;--wi:#7B1E3A;--wit:#7B1E3A;--li:#A9C46B;--ln:#E4DDC6;--ok:#4C7A2A;--am:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13150E;--pn:#1D2015;--ink:#F1ECD9;--mu:#A5A38C;--sb:#0D0F08;--ac:#A9C46B;--wi:#B8405F;--wit:#F08FA8;--ln:#2E3322;--ok:#8CC05A;--am:#E3A94B}}
:root[data-theme="dark"]{--bg:#13150E;--pn:#1D2015;--ink:#F1ECD9;--mu:#A5A38C;--sb:#0D0F08;--ac:#A9C46B;--wi:#B8405F;--wit:#F08FA8;--ln:#2E3322;--ok:#8CC05A;--am:#E3A94B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--sb);color:#F1ECD9;padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px}
.br{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}.br b{display:block;font-size:17px}.br small{color:#A9C46B}
nav{display:flex;flex-direction:column;gap:4px}
nav button,#th{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:#E6E1CB;font-weight:500}
nav button:hover,#th:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--li);color:#25300F;font-weight:700}
#th{margin-top:auto;font-size:13px;color:#A9C46B}
main{padding:20px 28px 48px;min-width:0}
.tb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tb small{color:var(--mu);display:block}.tr{display:flex;gap:8px;align-items:center;position:relative}
h1{font-size:24px;margin:0 0 14px}h2{font-size:16px;margin:0 0 12px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}.g .c{margin:0}
.k b{display:block;font-size:28px;letter-spacing:-.02em}.k span{color:var(--mu);font-size:13px}
.bn{background:color-mix(in srgb,var(--wit) 12%,var(--pn));border:1px solid color-mix(in srgb,var(--wit) 35%,transparent);border-radius:12px;padding:11px 14px;margin-bottom:14px}
a[data-a],.lk{color:var(--wit);font-weight:700;cursor:pointer;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--ln)}
td{padding:10px 8px;border-bottom:1px solid var(--ln)}tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:color-mix(in srgb,var(--li) 14%,transparent)}
.tw{overflow-x:auto}
.pl{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.Alta{background:color-mix(in srgb,var(--wit) 15%,transparent);color:var(--wit)}.Media{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}.Baja{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.es.v{color:var(--wit);font-weight:700}
.b,select,input{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 12px}
.b{cursor:pointer;font-weight:600}.b:hover{border-color:var(--ac)}.b.p{background:var(--wi);border-color:var(--wi);color:#fff}
.tl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.cg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.cg .c{margin:0}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.st.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.st.no{background:color-mix(in srgb,var(--wit) 15%,transparent);color:var(--wit)}.st.mu{background:var(--ln);color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--li)}
.dr{position:fixed;top:0;right:0;width:min(430px,100%);height:100%;background:var(--pn);border-left:1px solid var(--ln);padding:22px;overflow:auto;transform:translateX(105%);transition:transform .25s;z-index:5;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.dr.o{transform:none}
.np{position:absolute;right:0;top:44px;width:min(340px,86vw);background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;display:none;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.15)}.np.o{display:block}
.np p{margin:0;padding:8px;border-bottom:1px solid var(--ln);font-size:13px}.np p:last-child{border:0}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sb);color:#F1ECD9;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.o{opacity:1}
@keyframes pu{0%{r:9;opacity:.6}100%{r:22;opacity:0}}.pu{animation:pu 1.6s infinite}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.br{border:0;margin:0;padding:0 10px 0 0}nav{flex-direction:row;overflow-x:auto}#th{margin:0}main{padding:16px}}
.lg{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lbrand{background:var(--sb);color:#F1ECD9;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.lbrand b{font-size:32px;letter-spacing:-.02em}.lbrand p{max-width:380px;color:#D9D4BC;margin:0}.lbrand small{color:var(--li)}
.lcard{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:auto}.lcard input{width:100%}
.pf{display:flex;gap:6px;background:var(--ln);padding:4px;border-radius:12px}.pf button{all:unset;flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mu)}.pf button.on{background:var(--pn);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
code{background:var(--ln);padding:1px 6px;border-radius:6px}
body:not(.in) .app{display:none}body.in .lg{display:none}
@media(max-width:820px){.lg{grid-template-columns:1fr}.lbrand{padding:28px;justify-content:flex-start}.lcard{padding:28px}}

textarea{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 12px;width:100%}
.mp{position:relative;border-radius:12px;overflow:hidden;line-height:0}.mp img{width:100%;display:block}
.pin{all:unset;position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--c);color:#fff;font:700 13px/24px system-ui;text-align:center;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);z-index:2}
.pin.sel{outline:3px solid #1D1E16;outline-offset:2px}
.pin.al::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--c);animation:rg 1.6s infinite}
@keyframes rg{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.3);opacity:0}}
.pt{position:absolute;transform:translate(-50%,18px);background:rgba(20,22,14,.85);color:#fff;font:600 10px/1.2 system-ui;padding:2px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:1}
.cap{color:var(--mu);font-size:12px;margin:4px 0 0}.lgd{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:13px}.lgd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mail{border-top:1px solid var(--ln);margin-top:8px;padding-top:10px;font-size:13px}.mail input{width:100%;margin:6px 0}
</style>
</head>
<body>
<div class="lg" id="lg"><div class="lbrand"><b>Plataforma hídrica</b><p>Monitoreo, detección de anomalías y gestión del consumo de agua en la Manzana Académica.</p><small>Universidad Central</small></div>
<div class="lcard"><h1>Iniciar sesión</h1><p style="color:var(--mu);margin:0 0 14px">Elige tu perfil e ingresa tus credenciales.</p>
<div class="pf"><button class="on" data-a="perfil" data-r="Administrador">Administrador</button><button data-a="perfil" data-r="Trabajador">Trabajador</button><button data-a="perfil" data-r="Espectador">Espectador</button></div>
<label for="lu">Usuario</label><input id="lu" autocomplete="username"><label for="lc">Contraseña</label><input id="lc" type="password" autocomplete="current-password">
<p id="le" role="alert" style="color:var(--wit);min-height:20px;margin:8px 0"></p><button class="b p" data-a="lgin" style="width:100%">Ingresar</button>
<p style="color:var(--mu);font-size:13px;margin:16px 0 4px">Cuentas de demostración (usuario / contraseña):</p><div id="lh" style="font-size:13px"></div><button class="b" data-a="demo" style="margin-top:10px">Rellenar cuenta de demostración</button></div></div>
<div class="app">
<aside><div class="br"><b>Plataforma hídrica</b><small>Universidad Central</small></div><nav id="nav"></nav><button id="th">Cambiar tema</button></aside>
<main>
<header class="tb"><div><span id="who"></span><small id="nx"></small></div>
<div class="tr">
<button class="b" data-a="bell" id="bell">Notificaciones</button><button class="b" data-a="out">Cerrar sesión</button><div class="np" id="np"></div></div></header>
<section id="v"></section>
</main></div>
<aside class="dr" id="dr" aria-live="polite"></aside><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),M=6e4,L=n=>Math.round(n).toLocaleString('es-CO'),H=36e5;
const F=t=>new Date(t).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const mk=b=>Array.from({length:12},()=>b*(.8+Math.random()*.4));
const med=[{id:'MED-001',n:'Bloque A · Baños',z:'Edificio A',x:130,y:95,l:9200,b:60},{id:'MED-002',n:'Bloque A · General',z:'Edificio A',x:130,y:215,l:11400,b:80},{id:'MED-003',n:'Bloque B · Laboratorios',z:'Edificio B',x:350,y:95,l:6100,b:45},{id:'MED-004',n:'Cafetería central',z:'Cafetería',x:350,y:225,l:8300,b:55},{id:'MED-005',n:'Bloque C · General',z:'Edificio C',x:535,y:160,l:6280,b:50}];
med.forEach(m=>{m.f=0;m.s=mk(m.b)});
const tr=[{id:1,n:'Carlos Rojas',d:7,h:15,on:1},{id:2,n:'Laura Pineda',d:13,h:21,on:1},{id:3,n:'Andrés Gómez',d:6,h:14,on:0}];
let an=[{id:57,m:'MED-003',p:'Alta',e:'Detectada',t:null,at:Date.now()-18*M},{id:56,m:'MED-001',p:'Alta',e:'Asignada',t:1,at:Date.now()-140*M},{id:55,m:'MED-005',p:'Alta',e:'En atención',t:1,at:Date.now()-900*M},{id:54,m:'MED-002',p:'Alta',e:'Detectada',t:null,at:Date.now()-190*M},{id:53,m:'MED-004',p:'Media',e:'Resuelta',t:2,at:Date.now()-1800*M},{id:52,m:'MED-003',p:'Baja',e:'Resuelta',t:1,at:Date.now()-2400*M}];
an.forEach(a=>{a.h={Detectada:a.at};if(a.e!=='Detectada')a.h.Asignada=a.at+20*M;if(a.e==='En atención')a.h['En atención']=a.at+50*M;if(a.e==='Resuelta')a.h.Resuelta=a.at+3*H});
an.filter(a=>a.e!=='Resuelta').forEach(a=>mn(a.m).f=1);
const S={rol:'Administrador',v:'Inicio',q:'',est:'Todas',pri:'Todas',mid:'MED-003',un:1,res:[3,3.4,3.2],nt:[{t:Date.now()-5*M,x:'Anomalía 57 detectada en MED-003 (prioridad alta)'}]};
function mn(id){return med.find(m=>m.id===id)}
const wk=id=>(tr.find(t=>t.id===id)||{}).n||'Sin asignar',open=a=>a.e!=='Resuelta',venc=a=>a.e==='Detectada'&&Date.now()-a.at>60*M;
const hr=()=>new Date().getHours(),av=t=>t.on&&hr()>=t.d&&hr()<t.h,ld=t=>an.filter(a=>a.t===t.id&&open(a)).length;
const NAV={Administrador:['Inicio','Medidores','Mapa','Anomalías','Trabajadores'],Trabajador:['Inicio','Medidores','Mapa','Anomalías'],Espectador:['Inicio','Medidores','Mapa']};
const WHO={Administrador:'Administrador: Sofía Herrera',Trabajador:'Trabajador: Carlos Rojas',Espectador:'Espectador: comunidad universitaria'};
const pl=p=>`<span class="pl ${p}">${p}</span>`,es=a=>`<span class="es">${a.e}${venc(a)?' (vencida)':''}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('o');setTimeout(()=>t.classList.remove('o'),2400)};
const nt=x=>{const aviso={t:Date.now(),x};S.nt.unshift(aviso);S.un++;bell();return aviso};
const spark=v=>{const mx=Math.max(...v),p=v.map((y,i)=>`${i*(160/11)},${38-y/mx*34}`).join(' ');return `<svg viewBox="0 0 160 40" width="100%" height="40"><polyline points="${p}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`};
const mine=a=>S.rol!=='Trabajador'||a.t===S.tid;
const V={};
V.Inicio=()=>{const o=an.filter(open),ve=an.filter(venc),tot=med.reduce((s,m)=>s+m.l,0),c=p=>o.filter(a=>a.p===p).length,avg=S.res.reduce((a,b)=>a+b,0)/S.res.length,h=hr();
const r=Array.from({length:h+1},(_,i)=>.15+Math.exp(-((i-12)**2)/16)),sm=r.reduce((a,b)=>a+b,0),vals=r.map(x=>x/sm*tot),mx=Math.max(...vals),pts=vals.map((y,i)=>`${40+i*(560/23)},${150-y/mx*120}`);
const area=`${pts.join(' ')} ${40+h*(560/23)},150 40,150`;
return `<h1>Inicio</h1>${ve.length?`<div class="bn"><b>Atención:</b> hay ${ve.length} anomalía(s) vencida(s) sin asignar. ${S.rol==='Administrador'?'<a data-a="go" data-v="Anomalías" data-est="Detectada">Asignarla ahora</a>':''}</div>`:''}
<div class="g"><div class="c k"><b>${L(tot)} L</b><span>Consumo de hoy en los medidores activos</span></div>
<div class="c k"><b>${o.length}</b><span>Anomalías abiertas: ${c('Alta')} Alta, ${c('Media')} Media, ${c('Baja')} Baja</span></div>
<div class="c k"><b>${avg.toFixed(1).replace('.',',')} h</b><span>Tiempo medio de atención, últimos 30 días</span></div>
<div class="c k"><b>${med.filter(m=>m.f).length} de ${med.length}</b><span>Medidores con falla activa</span></div></div>
<div class="c"><h2>Consumo por hora, hoy (L)</h2><svg viewBox="0 0 620 175" width="100%"><polygon points="${area}" fill="var(--li)" opacity=".35"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${[0,6,12,18,23].map(i=>`<text x="${40+i*(560/23)}" y="168" font-size="11" fill="var(--mu)" text-anchor="middle">${i}:00</text>`).join('')}</svg></div>
<div class="c"><h2>Anomalías recientes</h2>${tbl(an.filter(mine).sort((a,b)=>b.at-a.at).slice(0,5))}</div>`};
function tbl(l){return l.length?`<div class="tw"><table><thead><tr><th>N.°</th><th>Medidor</th><th>Prioridad</th><th>Estado</th><th>Trabajador</th><th>Detectada</th></tr></thead><tbody>${l.map(a=>`<tr data-a="ver" data-id="${a.id}"><td><span class="lk">${a.id}</span></td><td>${a.m}</td><td>${pl(a.p)}</td><td>${es(a)}</td><td>${wk(a.t)}</td><td>${F(a.at)}</td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--mu)">Sin resultados para estos filtros.</p>'}
V.Medidores=()=>`<h1>Medidores</h1><div class="cg">${med.map(m=>`<div class="c"><div style="display:flex;justify-content:space-between"><b>${m.n}</b><span class="st ${m.f?'no':'ok'}">${m.f?'En falla':'Normal'}</span></div><small style="color:var(--mu)">${m.id} · ${m.z}</small><div style="font-size:22px;font-weight:700;margin:8px 0">${L(m.l)} L <small style="font-size:12px;color:var(--mu);font-weight:400">hoy</small></div>${spark(m.s)}<p style="margin:10px 0 0"><a data-a="pin" data-id="${m.id}">Ver en el mapa</a></p></div>`).join('')}</div>`;
V.Mapa=()=>{const m=mn(S.mid),oa=an.filter(a=>a.m===m.id&&open(a));return `<h1>Mapa</h1><div class="c"><svg viewBox="0 0 640 310" width="100%"><rect width="640" height="310" rx="12" fill="color-mix(in srgb,var(--li) 12%,var(--pn))"/><rect x="0" y="262" width="640" height="26" fill="var(--ln)"/><text x="16" y="279" font-size="11" fill="var(--mu)">Carrera 5</text>${[['Edificio A',60,50,150,200],['Edificio B',280,50,150,100],['Cafetería',280,170,150,70],['Edificio C',470,90,130,140]].map(b=>`<rect x="${b[1]}" y="${b[2]}" width="${b[3]}" height="${b[4]}" rx="10" fill="var(--pn)" stroke="var(--ln)"/><text x="${b[1]+8}" y="${b[2]+16}" font-size="11" fill="var(--mu)">${b[0]}</text>`).join('')}${med.map(x=>`<g data-a="pin" data-id="${x.id}" style="cursor:pointer">${x.f?`<circle class="pu" cx="${x.x}" cy="${x.y}" r="9" fill="var(--wi)"/>`:''}<circle cx="${x.x}" cy="${x.y}" r="9" fill="${x.f?'var(--wi)':'var(--ok)'}" stroke="#fff" stroke-width="${x.id===S.mid?4:2}"/><text x="${x.x}" y="${x.y+24}" font-size="10" text-anchor="middle" fill="var(--ink)">${x.id}</text></g>`).join('')}</svg>
<p style="color:var(--mu);font-size:13px">Esquema ilustrativo de la Manzana Académica. Verde: normal. Vino: falla activa.</p></div>
<div class="c"><h2>${m.n} · ${m.id}</h2><p>${m.z} · ${L(m.l)} L hoy · <span class="st ${m.f?'no':'ok'}">${m.f?'En falla':'Normal'}</span></p>${oa.length?tbl(oa):'<p style="color:var(--mu)">Sin anomalías abiertas.</p>'}</div>`};
V['Anomalías']=()=>`<h1>Anomalías</h1><div class="c"><div class="controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="q" placeholder="Buscar por N.° o medidor" value="${S.q}"><select id="fe">${['Todas','Detectada','Asignada','En atención','Resuelta'].map(x=>`<option ${x===S.est?'selected':''}>${x}</option>`).join('')}</select><select id="fp">${['Todas','Alta','Media','Baja'].map(x=>`<option ${x===S.pri?'selected':''}>${x}</option>`).join('')}</select></div><div id="tb">${tb()}</div></div>`;
function tb(){const q=S.q.toLowerCase();return tbl(an.filter(mine).filter(a=>(S.est==='Todas'||a.e===S.est)&&(S.pri==='Todas'||a.p===S.pri)&&(!q||String(a.id).includes(q)||a.m.toLowerCase().includes(q)||mn(a.m).n.toLowerCase().includes(q))).sort((a,b)=>b.at-a.at))}
V.Trabajadores=()=>`<h1>Trabajadores</h1><div class="cg">${tr.map(t=>{const l=ld(t);return `<div class="c"><div style="display:flex;justify-content:space-between"><b>${t.n}</b><span class="st ${!t.on?'mu':av(t)?'ok':'no'}">${!t.on?'Inactivo':av(t)?'Disponible ahora':'Fuera de turno'}</span></div><p style="color:var(--mu);margin:6px 0">Turno ${t.d}:00 a ${t.h}:00 · lunes a viernes</p><small>Carga actual: ${l} anomalía(s)</small><div class="bar"><i style="width:${Math.min(l*34,100)}%"></i></div>${S.rol==='Administrador'?`<p style="margin:12px 0 0"><button class="b" data-a="tgl" data-id="${t.id}">${t.on?'Desactivar':'Activar'}</button></p>`:''}</div>`}).join('')}</div>`;
function D(id){const a=an.find(x=>x.id==id),m=mn(a.m);let ac='';
if(S.rol==='Administrador'&&open(a)&&a.e!=='En atención')ac=`<label for="as">Asignar a</label><select id="as">${tr.filter(t=>t.on).map(t=>`<option value="${t.id}" ${t.id===a.t?'selected':''}>${t.n}${av(t)?'':' (fuera de turno)'}</option>`).join('')}</select> <button class="b p" data-a="asig" data-id="${a.id}">${a.t?'Reasignar':'Asignar'}</button>`;

async function enviarAlTrabajador(a,aviso,esReintento=false){

 if(!trabajador){if(aviso)aviso.m='Pendiente: no hay trabajador asignado';bell();return false}

 const datos={trabajador_id:trabajador.id,anomalia_id:a.id,medidor:a.m,ubicacion:mn(a.m).z,prioridad:a.p,estado:a.e};
 try{
  const r=await fetch(API_URL+'/notificar-trabajador',{
   method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)
  });
  const body=await r.json().catch(()=>({}));
  if(!r.ok){
   if(aviso)aviso.m=`No se pudo enviar la notificación a ${trabajador.n} (HTTP ${r.status}).`;
   bell();return false;
  }
  const texto=body.modo==='prueba'?`Notificacion para ${trabajador.n} enviada al buzon de pruebas`:`Notificacion enviada a ${trabajador.n}`;
  if(aviso)aviso.m=texto;

  return true;
 }catch(error){

 }finally{enviosEnCurso.delete(clave)}
}

V.Trabajadores=()=>`<h1>Trabajadores</h1><div class="cg">${tr.map(t=>{const l=ld(t);return `<div class="c"><div style="display:flex;justify-content:space-between;gap:8px"><b>${t.n}</b><span class="st ${!t.on?'mu':av(t)?'ok':'no'}">${!t.on?'No disponible':av(t)?'Disponible ahora':'Fuera de turno'}</span></div><p style="color:var(--mu);margin:6px 0">Turno ${t.d}:00 a ${t.h}:00</p><small>Carga actual: ${l} anomalía(s)</small><div class="bar"><i style="width:${Math.min(l*34,100)}%"></i></div>${S.rol==='Administrador'?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px"><input id="d${t.id}" type="number" min="0" max="23" value="${t.d}" style="width:64px" aria-label="Desde la hora"> a <input id="h${t.id}" type="number" min="0" max="23" value="${t.h}" style="width:64px" aria-label="Hasta la hora"><button class="b" data-a="turno" data-id="${t.id}">Guardar turno</button><button class="b" data-a="tgl" data-id="${t.id}">${t.on?'Marcar no disponible':'Marcar disponible'}</button></div>`:''}</div>`}).join('')}</div>`;
document.addEventListener('click',e=>{const t=e.target.closest('[data-a="turno"],[data-a="tgl"]');if(!t)return;const w=tr.find(x=>x.id==t.dataset.id);
if(t.dataset.a==='turno'){const d=+$('#d'+w.id).value,h=+$('#h'+w.id).value;if(!(d>=0&&h<=23&&d<h)){toast('El turno debe estar entre 0 y 23 h, con inicio menor que fin');return}w.d=d;w.h=h;toast('Turno guardado')}
autoAll();render()});
setInterval(()=>{const g=$('#gc');if(g&&$('#dr').classList.contains('o')){const a=an.find(x=>x.id==g.dataset.id);if(a)g.innerHTML=chart(mn(a.m),a)}},30000);
</script>
</body>
</html>
