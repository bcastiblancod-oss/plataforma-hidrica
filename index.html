<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma hídrica · Universidad Central</title>
<style>
:root{--bg:#F5F0E1;--pn:#FFFDF7;--ink:#1D1E16;--mu:#6C6B58;--sb:#33401B;--ac:#586A33;--wi:#7B1E3A;--wit:#7B1E3A;--li:#A9C46B;--ln:#E4DDC6;--ok:#4C7A2A;--am:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13150E;--pn:#1D2015;--ink:#F1ECD9;--mu:#A5A38C;--sb:#0D0F08;--ac:#A9C46B;--wi:#B8405F;--wit:#F08FA8;--ln:#2E3322;--ok:#8CC05A;--am:#E3A94B}}
:root[data-theme="dark"]{--bg:#13150E;--pn:#1D2015;--ink:#F1ECD9;--mu:#A5A38C;--sb:#0D0F08;--ac:#A9C46B;--wi:#B8405F;--wit:#F08FA8;--ln:#2E3322;--ok:#8CC05A;--am:#E3A94B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--sb);color:#F1ECD9;padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px}
.br{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}.br b{display:block;font-size:17px}.br small{color:#A9C46B}
nav{display:flex;flex-direction:column;gap:4px}
nav button,#th{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:#E6E1CB;font-weight:500}
nav button:hover,#th:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--li);color:#25300F;font-weight:700}
#th{margin-top:auto;font-size:13px;color:#A9C46B}
main{padding:20px 28px 48px;min-width:0}
.tb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tb small{color:var(--mu);display:block}.tr{display:flex;gap:8px;align-items:center;position:relative}
h1{font-size:24px;margin:0 0 14px}h2{font-size:16px;margin:0 0 12px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}.g .c{margin:0}
.k b{display:block;font-size:28px;letter-spacing:-.02em}.k span{color:var(--mu);font-size:13px}
.bn{background:color-mix(in srgb,var(--wit) 12%,var(--pn));border:1px solid color-mix(in srgb,var(--wit) 35%,transparent);border-radius:12px;padding:11px 14px;margin-bottom:14px}
a[data-a],.lk{color:var(--wit);font-weight:700;cursor:pointer;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--ln)}
td{padding:10px 8px;border-bottom:1px solid var(--ln)}tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:color-mix(in srgb,var(--li) 14%,transparent)}
.tw{overflow-x:auto}
.pl{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.Alta{background:color-mix(in srgb,var(--wit) 15%,transparent);color:var(--wit)}.Media{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}.Baja{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.es.v{color:var(--wit);font-weight:700}
.b,select,input{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 12px}
.b{cursor:pointer;font-weight:600}.b:hover{border-color:var(--ac)}.b.p{background:var(--wi);border-color:var(--wi);color:#fff}
.tl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.cg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.cg .c{margin:0}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.st.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.st.no{background:color-mix(in srgb,var(--wit) 15%,transparent);color:var(--wit)}.st.mu{background:var(--ln);color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--li)}
.dr{position:fixed;top:0;right:0;width:min(430px,100%);height:100%;background:var(--pn);border-left:1px solid var(--ln);padding:22px;overflow:auto;transform:translateX(105%);transition:transform .25s;z-index:5;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.dr.o{transform:none}
.np{position:absolute;right:0;top:44px;width:min(340px,86vw);background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;display:none;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.15)}.np.o{display:block}
.np p{margin:0;padding:8px;border-bottom:1px solid var(--ln);font-size:13px}.np p:last-child{border:0}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sb);color:#F1ECD9;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.o{opacity:1}
@keyframes pu{0%{r:9;opacity:.6}100%{r:22;opacity:0}}.pu{animation:pu 1.6s infinite}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.br{border:0;margin:0;padding:0 10px 0 0}nav{flex-direction:row;overflow-x:auto}#th{margin:0}main{padding:16px}}
.lg{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lbrand{background:var(--sb);color:#F1ECD9;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.lbrand b{font-size:32px;letter-spacing:-.02em}.lbrand p{max-width:380px;color:#D9D4BC;margin:0}.lbrand small{color:var(--li)}
.lcard{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:auto}.lcard input{width:100%}
.pf{display:flex;gap:6px;background:var(--ln);padding:4px;border-radius:12px}.pf button{all:unset;flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mu)}.pf button.on{background:var(--pn);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
code{background:var(--ln);padding:1px 6px;border-radius:6px}
body:not(.in) .app{display:none}body.in .lg{display:none}
@media(max-width:820px){.lg{grid-template-columns:1fr}.lbrand{padding:28px;justify-content:flex-start}.lcard{padding:28px}}

textarea{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 12px;width:100%}
.mp{position:relative;border-radius:12px;overflow:hidden;line-height:0}.mp img{width:100%;display:block}
.pin{all:unset;position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--c);color:#fff;font:700 13px/24px system-ui;text-align:center;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);z-index:2}
.pin.sel{outline:3px solid #1D1E16;outline-offset:2px}
.pin.al::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--c);animation:rg 1.6s infinite}
@keyframes rg{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.3);opacity:0}}
.pt{position:absolute;transform:translate(-50%,18px);background:rgba(20,22,14,.85);color:#fff;font:600 10px/1.2 system-ui;padding:2px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:1}
.cap{color:var(--mu);font-size:12px;margin:4px 0 0}.lgd{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:13px}.lgd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mail{border-top:1px solid var(--ln);margin-top:8px;padding-top:10px;font-size:13px}.mail input{width:100%;margin:6px 0}

/* ===== Mejoras ===== */
/* Panel lateral: era un <aside> y heredaba display:flex del menú, lo que aplastaba el textarea */
.dr{display:block;gap:0;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.dr>*{flex-shrink:0}
.dr textarea{display:block;min-height:110px;resize:vertical;line-height:1.4}
.dr select,.dr input{max-width:100%}
.dr{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.dr .b{white-space:normal;overflow-wrap:anywhere}
@media(min-width:1000px){.dr{width:min(520px,42vw)}}
@media(max-width:820px){.dr{width:100%;padding:18px 16px 54px}}
/* Inicio */
.ig{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}.ig .c{margin:0}
@media(max-width:1000px){.ig{grid-template-columns:1fr}}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.hd2 h2{margin:0}
.sg{display:inline-flex;gap:4px;background:var(--ln);padding:3px;border-radius:12px}
.sg button{all:unset;cursor:pointer;padding:5px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mu)}
.sg button:hover{color:var(--ink)}.sg button.on{background:var(--pn);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.sg button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
/* Mapa */
.mg{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}.mg .c{margin:0}
@media(min-width:1100px){.mg{grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr)}}
.mp{max-width:740px;margin-inline:auto;border:1px solid var(--ln);box-shadow:0 6px 22px rgba(0,0,0,.10)}
.pin{width:26px;height:26px;margin:-13px 0 0 -13px;font-size:12px;line-height:20px}
@media(max-width:820px){.pin{width:30px;height:30px;margin:-15px 0 0 -15px;line-height:24px}}
/* Asistente */
.chat{display:flex;flex-direction:column;gap:12px;max-width:880px}.chat.c{margin-bottom:0}
.cm{height:min(58vh,540px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.cu{align-self:flex-end;background:var(--wi);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.cb{align-self:flex-start;background:color-mix(in srgb,var(--li) 14%,var(--pn));border:1px solid var(--ln);padding:10px 13px;border-radius:14px 14px 14px 4px;max-width:94%}
.cb .tx{white-space:pre-wrap;overflow-wrap:anywhere}.cb hr{border:0;border-top:1px solid var(--ln);margin:10px 0 6px}
.au{font-size:12px;color:var(--mu);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .b{font-size:13px;padding:5px 11px;border-radius:99px;font-weight:500}
.cin{display:flex;gap:8px}.cin input{flex:1;min-width:0}

/* Asistente mejorado: animación y exportación PDF local */
.chat-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:9px}
.chat-tools .b{font-size:13px}
.chat-wait{display:flex;align-items:center;gap:9px;color:var(--mu);font-size:13px;padding:6px 3px}
.chat-dots{display:inline-flex;gap:4px;align-items:center}
.chat-dots i{height:7px;width:7px;border-radius:50%;background:var(--ac);animation:chatpulse 1s infinite ease-in-out;opacity:.35}
.chat-dots i:nth-child(2){animation-delay:.15s}.chat-dots i:nth-child(3){animation-delay:.3s}
@keyframes chatpulse{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}
.chat-wait[hidden]{display:none}
.chat-catalog{max-height:250px;overflow:auto;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}
.chat-catalog button{display:block;text-align:left;width:100%;font-size:12px;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:7px 4px;background:transparent;color:var(--ink);cursor:pointer}
.chat-catalog button:hover{color:var(--wit)}
.chat.c{width:100%}
@media print{body{background:white!important}.app,.lg,.dr,#toast{display:none!important}}
</style>
</head>
<body>
<div class="lg" id="lg"><div class="lbrand"><b>Plataforma hídrica</b><p>Monitoreo, detección de anomalías y gestión del consumo de agua en la Manzana Académica.</p><small>Universidad Central</small></div>
<div class="lcard"><h1>Iniciar sesión</h1><p style="color:var(--mu);margin:0 0 14px">Elige tu perfil e ingresa tus credenciales.</p>
<div class="pf"><button class="on" data-a="perfil" data-r="Administrador">Administrador</button><button data-a="perfil" data-r="Trabajador">Trabajador</button><button data-a="perfil" data-r="Espectador">Espectador</button></div>
<label for="lu">Usuario</label><input id="lu" autocomplete="username"><label for="lc">Contraseña</label><input id="lc" type="password" autocomplete="current-password">
<p id="le" role="alert" style="color:var(--wit);min-height:20px;margin:8px 0"></p><button class="b p" data-a="lgin" style="width:100%">Ingresar</button>
<p style="color:var(--mu);font-size:13px;margin:16px 0 4px">Cuentas de demostración (usuario / contraseña):</p><div id="lh" style="font-size:13px"></div><button class="b" data-a="demo" style="margin-top:10px">Rellenar cuenta de demostración</button></div></div>
<div class="app">
<aside><div class="br"><b>Plataforma hídrica</b><small>Universidad Central</small></div><nav id="nav"></nav><button id="th">Cambiar tema</button></aside>
<main>
<header class="tb"><div><span id="who"></span><small id="nx"></small></div>
<div class="tr">
<button class="b" data-a="bell" id="bell">Notificaciones</button><button class="b" data-a="out">Cerrar sesión</button><div class="np" id="np"></div></div></header>
<section id="v"></section>
</main></div>
<aside class="dr" id="dr" aria-live="polite"></aside><div id="toast"></div>
<script src="asistente-base.js"></script>
<script>
const $=s=>document.querySelector(s),M=6e4,L=n=>Math.round(n).toLocaleString('es-CO'),H=36e5;
const F=t=>new Date(t).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const mk=b=>Array.from({length:12},()=>b*(.8+Math.random()*.4));
const med=[{id:'MED-001',n:'Bloque A · Baños',z:'Edificio A',x:130,y:95,l:9200,b:60},{id:'MED-002',n:'Bloque A · General',z:'Edificio A',x:130,y:215,l:11400,b:80},{id:'MED-003',n:'Bloque B · Laboratorios',z:'Edificio B',x:350,y:95,l:6100,b:45},{id:'MED-004',n:'Cafetería central',z:'Cafetería',x:350,y:225,l:8300,b:55},{id:'MED-005',n:'Bloque C · General',z:'Edificio C',x:535,y:160,l:6280,b:50}];
med.forEach(m=>{m.f=0;m.s=mk(m.b)});
const tr=[{id:1,n:'Carlos Rojas',d:7,h:15,on:1},{id:2,n:'Laura Pineda',d:13,h:21,on:1},{id:3,n:'Andrés Gómez',d:6,h:14,on:0}];
let an=[{id:57,m:'MED-003',p:'Alta',e:'Detectada',t:null,at:Date.now()-18*M},{id:56,m:'MED-001',p:'Alta',e:'Asignada',t:1,at:Date.now()-140*M},{id:55,m:'MED-005',p:'Alta',e:'En atención',t:1,at:Date.now()-900*M},{id:54,m:'MED-002',p:'Alta',e:'Detectada',t:null,at:Date.now()-190*M},{id:53,m:'MED-004',p:'Media',e:'Resuelta',t:2,at:Date.now()-1800*M},{id:52,m:'MED-003',p:'Baja',e:'Resuelta',t:1,at:Date.now()-2400*M}];
an.forEach(a=>{a.h={Detectada:a.at};if(a.e!=='Detectada')a.h.Asignada=a.at+20*M;if(a.e==='En atención')a.h['En atención']=a.at+50*M;if(a.e==='Resuelta')a.h.Resuelta=a.at+3*H});
an.filter(a=>a.e!=='Resuelta').forEach(a=>mn(a.m).f=1);
const S={rol:'Administrador',v:'Inicio',q:'',est:'Todas',pri:'Todas',mid:'MED-003',un:1,res:[3,3.4,3.2],nt:[{t:Date.now()-5*M,x:'Anomalía 57 detectada en MED-003 (prioridad alta)'}]};
function mn(id){return med.find(m=>m.id===id)}
const wk=id=>(tr.find(t=>t.id===id)||{}).n||'Sin asignar',open=a=>a.e!=='Resuelta',venc=a=>a.e==='Detectada'&&Date.now()-a.at>60*M;
const hr=()=>new Date().getHours(),av=t=>t.on&&hr()>=t.d&&hr()<t.h,ld=t=>an.filter(a=>a.t===t.id&&open(a)).length;
const NAV={Administrador:['Inicio','Medidores','Mapa','Anomalías','Trabajadores'],Trabajador:['Inicio','Medidores','Mapa','Anomalías'],Espectador:['Inicio','Medidores','Mapa']};
const WHO={Administrador:'Administrador: Sofía Herrera',Trabajador:'Trabajador: Carlos Rojas',Espectador:'Espectador: comunidad universitaria'};
const pl=p=>`<span class="pl ${p}">${p}</span>`,es=a=>`<span class="es">${a.e}${venc(a)?' (vencida)':''}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('o');setTimeout(()=>t.classList.remove('o'),2400)};
const nt=x=>{const aviso={t:Date.now(),x};S.nt.unshift(aviso);S.un++;bell();return aviso};
const spark=v=>{const mx=Math.max(...v),p=v.map((y,i)=>`${i*(160/11)},${38-y/mx*34}`).join(' ');return `<svg viewBox="0 0 160 40" width="100%" height="40"><polyline points="${p}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`};
const mine=a=>S.rol!=='Trabajador'||a.t===S.tid;
const V={};

function tbl(l){return l.length?`<div class="tw"><table><thead><tr><th>N.°</th><th>Medidor</th><th>Prioridad</th><th>Estado</th><th>Trabajador</th><th>Detectada</th></tr></thead><tbody>${l.map(a=>`<tr data-a="ver" data-id="${a.id}"><td><span class="lk">${a.id}</span></td><td>${a.m}</td><td>${pl(a.p)}</td><td>${es(a)}</td><td>${wk(a.t)}</td><td>${F(a.at)}</td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--mu)">Sin resultados para estos filtros.</p>'}
V.Medidores=()=>`<h1>Medidores</h1><div class="cg">${med.map(m=>`<div class="c"><div style="display:flex;justify-content:space-between"><b>${m.n}</b><span class="st ${m.f?'no':'ok'}">${m.f?'En falla':'Normal'}</span></div><small style="color:var(--mu)">${m.id} · ${m.z}</small><div style="font-size:22px;font-weight:700;margin:8px 0">${L(m.l)} L <small style="font-size:12px;color:var(--mu);font-weight:400">hoy</small></div>${spark(m.s)}<p style="margin:10px 0 0"><a data-a="pin" data-id="${m.id}">Ver en el mapa</a></p></div>`).join('')}</div>`;

V['Anomalías']=()=>`<h1>Anomalías</h1><div class="c"><div class="controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="q" placeholder="Buscar por N.° o medidor" value="${S.q}"><select id="fe">${['Todas','Detectada','Asignada','En atención','Resuelta'].map(x=>`<option ${x===S.est?'selected':''}>${x}</option>`).join('')}</select><select id="fp">${['Todas','Alta','Media','Baja'].map(x=>`<option ${x===S.pri?'selected':''}>${x}</option>`).join('')}</select></div><div id="tb">${tb()}</div></div>`;
function tb(){const q=S.q.toLowerCase();return tbl(an.filter(mine).filter(a=>(S.est==='Todas'||a.e===S.est)&&(S.pri==='Todas'||a.p===S.pri)&&(!q||String(a.id).includes(q)||a.m.toLowerCase().includes(q)||mn(a.m).n.toLowerCase().includes(q))).sort((a,b)=>b.at-a.at))}
V.Trabajadores=()=>`<h1>Trabajadores</h1><div class="cg">${tr.map(t=>{const l=ld(t);return `<div class="c"><div style="display:flex;justify-content:space-between"><b>${t.n}</b><span class="st ${!t.on?'mu':av(t)?'ok':'no'}">${!t.on?'Inactivo':av(t)?'Disponible ahora':'Fuera de turno'}</span></div><p style="color:var(--mu);margin:6px 0">Turno ${t.d}:00 a ${t.h}:00 · lunes a viernes</p><small>Carga actual: ${l} anomalía(s)</small><div class="bar"><i style="width:${Math.min(l*34,100)}%"></i></div>${S.rol==='Administrador'?`<p style="margin:12px 0 0"><button class="b" data-a="tgl" data-id="${t.id}">${t.on?'Desactivar':'Activar'}</button></p>`:''}</div>`}).join('')}</div>`;
function D(id){const a=an.find(x=>x.id==id),m=mn(a.m);let ac='';

async function enviarAlTrabajador(a,aviso,esReintento=false){
 const trabajador=tr.find(t=>t.id===a.t);
 if(!trabajador){if(aviso)aviso.m='Pendiente: no hay trabajador asignado';bell();return false}
 const clave=`${a.id}-${a.t}`;
 if(enviosEnCurso.has(clave))return false;
 enviosEnCurso.add(clave);
 if(aviso){aviso.m=`Enviando notificacion a ${trabajador.n}...`;bell()}
 const datos={trabajador_id:trabajador.id,anomalia_id:a.id,medidor:a.m,ubicacion:mn(a.m).z,prioridad:a.p,estado:a.e};
 try{
  const r=await fetch(API_URL+'/notificar-trabajador',{
   method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)
  });
  const body=await r.json().catch(()=>({}));
  if(!r.ok){
   if(aviso)aviso.m=`No se pudo enviar la notificación a ${trabajador.n} (HTTP ${r.status}).`;
   bell();return false;
  }
  const texto=body.modo==='prueba'?`Notificacion para ${trabajador.n} enviada al buzon de pruebas`:`Notificacion enviada a ${trabajador.n}`;
  if(aviso)aviso.m=texto;
  bell();
  toast(texto);
  return true;
 }catch(error){
  if(aviso)aviso.m='No se pudo enviar la notificación.';
  bell();return false;
 }finally{enviosEnCurso.delete(clave)}
}

  const t=tr.find(x=>x.id===trabajadorSeleccionado);

<script>
/* ===== Mejoras: gráfica de consumo, mapa y asistente ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
S.gr=6;
function consumoCard(){
 const g=S.gr||6,h=hr(),tot=med.reduce((s,m)=>s+m.l,0);
 const r=Array.from({length:h+1},(_,i)=>.15+Math.exp(-((i-12)**2)/16)),sm=r.reduce((a,b)=>a+b,0),vals=r.map(x=>x/sm*tot);
 const n=Math.ceil(24/g),bk=[];
 for(let k=0;k<n&&k*g<=h;k++){const a=k*g;bk.push({k,a,v:vals.slice(a,Math.min(a+g,h+1)).reduce((s,x)=>s+x,0),live:a+g>h})}
 const x0=46,x1=612,y0=20,y1=166,sw=(x1-x0)/n,bw=Math.min(sw*.72,56),mx=(Math.max(...bk.map(b=>b.v))*1.12)||1,Y=v=>y1-v/mx*(y1-y0);
 const rng=k=>g===1?`${k}:00`:`${k*g}–${k*g+g} h`;
 const grid=[0,.5,1].map(f=>`<line x1="${x0}" x2="${x1}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--ln)"/><text x="${x0-6}" y="${Y(mx*f)+4}" font-size="11" fill="var(--mu)" text-anchor="end">${L(mx*f)}</text>`).join('');
 const bars=bk.map(b=>{const x=x0+b.k*sw+(sw-bw)/2,y=Y(b.v);return `<rect x="${x}" y="${y}" width="${bw}" height="${y1-y}" rx="4" fill="${b.live?'var(--li)':'var(--ac)'}" ${b.live?'stroke="var(--ac)" stroke-width="1.5" stroke-dasharray="4 3"':'opacity=".92"'}><title>${rng(b.k)}: ${L(b.v)} L</title></rect>${g>=3?`<text x="${x+bw/2}" y="${y-5}" font-size="10" text-anchor="middle" fill="var(--ink)">${L(b.v)}</text>`:''}`}).join('');
 const xl=Array.from({length:n},(_,k)=>(g>1||k%3===0)?`<text x="${x0+k*sw+sw/2}" y="186" font-size="11" fill="var(--mu)" text-anchor="middle">${g===1?k+':00':rng(k)}</text>`:'').join('');
 return `<div class="hd2"><h2>${g===1?'Consumo por hora, hoy (L)':`Consumo cada ${g} h, hoy (L)`}</h2><div class="sg" role="group" aria-label="Intervalo del gráfico">${[1,3,6].map(v=>`<button class="${v===g?'on':''}" data-a="gr" data-g="${v}" aria-pressed="${v===g}">${v} h</button>`).join('')}</div></div>
<svg viewBox="0 0 620 196" width="100%" role="img" aria-label="Consumo de agua de hoy por intervalo">${grid}${bars}${xl}</svg><p class="cap">Distribución horaria estimada a partir de consumos simulados; no son lecturas históricas de sensores. Borde punteado: intervalo en curso.</p>`}
V.Inicio=()=>{const o=an.filter(open),ve=an.filter(venc),tot=med.reduce((s,m)=>s+m.l,0),c=p=>o.filter(a=>a.p===p).length,avg=S.res.reduce((a,b)=>a+b,0)/S.res.length,mx=Math.max(...med.map(m=>m.l));
const mb=[...med].sort((a,b)=>b.l-a.l).map(m=>`<div style="margin:0 0 12px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span><b>${m.id}</b> · ${m.n}</span><span>${L(m.l)} L</span></div><div class="bar"><i style="width:${m.l/mx*100}%;${m.f?'background:var(--wi)':''}"></i></div></div>`).join('');
return `<h1>Inicio</h1>${ve.length?`<div class="bn"><b>Atención:</b> hay ${ve.length} anomalía(s) vencida(s) sin asignar. ${S.rol==='Administrador'?'<a data-a="go" data-v="Anomalías" data-est="Detectada">Asignarla ahora</a>':''}</div>`:''}
<div class="g"><div class="c k"><b>${L(tot)} L</b><span>Consumo simulado de hoy en los medidores</span></div>
<div class="c k"><b>${o.length}</b><span>Anomalías abiertas: ${c('Alta')} Alta, ${c('Media')} Media, ${c('Baja')} Baja</span></div>
<div class="c k"><b>${avg.toFixed(1).replace('.',',')} h</b><span>Tiempo medio de atención (muestra simulada)</span></div>
<div class="c k"><b>${med.filter(m=>m.f).length} de ${med.length}</b><span>Medidores con falla activa</span></div></div>
<div class="ig"><div class="c" id="cw">${consumoCard()}</div><div class="c"><h2>Consumo por medidor, hoy</h2>${mb}<p class="cap">Barra vino: medidor con falla activa.</p></div></div>
<div class="c"><h2>Anomalías recientes</h2>${tbl(an.filter(mine).sort((a,b)=>b.at-a.at).slice(0,5))}</div>`};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a="gr"]');if(!t)return;S.gr=+t.dataset.g;const w=$('#cw');if(w)w.innerHTML=consumoCard()});

/* ---------- Mapa: más compacto, mapa a la izquierda y detalle a la derecha en PC ---------- */
V.Mapa=()=>{const m=mn(S.mid),ord={Alta:0,Media:1,Baja:2},oa=an.filter(a=>a.m===m.id&&open(a)).sort((a,b)=>ord[a.p]-ord[b.p]),la=oa[0]||an.filter(a=>a.m===m.id).sort((a,b)=>b.at-a.at)[0];
const pins=med.map(x=>{const o=an.filter(a=>a.m===x.id&&open(a)).sort((a,b)=>ord[a.p]-ord[b.p]),c=o.length?{Alta:'var(--wi)',Media:'var(--am)',Baja:'var(--ok)'}[o[0].p]:'var(--ok)',p=PO[x.id];
return `<button class="pin ${o.length?'al':''} ${x.id===S.mid?'sel':''}" data-a="pin" data-id="${x.id}" style="left:${p[0]}%;top:${p[1]}%;--c:${c}" title="${x.n}">${o.length||'✓'}</button><span class="pt" style="left:${p[0]}%;top:${p[1]}%">${x.id}</span>`}).join('');
return `<h1>Mapa</h1><div class="mg"><div class="c"><div class="mp"><img src="${MAPIMG}" alt="Esquema ilustrativo de cinco zonas de monitoreo; no es un plano oficial del campus">${pins}</div><p class="cap">Ubicaciones ilustrativas para el prototipo; sustituya el fondo por el plano validado del campus.</p><div class="lgd"><span><i style="background:var(--wi)"></i>Anomalía alta</span><span><i style="background:var(--am)"></i>Media</span><span><i style="background:var(--ok)"></i>Baja o sin anomalías (✓)</span><span style="color:var(--mu)">El número indica las anomalías abiertas del medidor.</span></div></div>
<div class="c"><h2>${m.n} · ${m.id}</h2><p>${m.z} · ${L(m.l)} L hoy · <span class="st ${m.f?'no':'ok'}">${m.f?'En falla':'Normal'}</span></p>${chart(m,la)}<h2 style="margin-top:14px">Anomalías abiertas</h2>${oa.length?tbl(oa):'<p style="color:var(--mu)">Sin anomalías abiertas: el consumo está dentro del rango normal.</p>'}</div></div>`};

/* ---------- Asistente inteligente (local, con datos simulados) ---------- */
NAV.Administrador.push('Asistente');
const NR=t=>' '+String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\- ]/g,' ').replace(/\s+/g,' ').trim()+' ';
const nA=n=>`${n} anomalía(s)`;
const ASIS={
 zonas(){const z={};med.forEach(m=>{(z[m.z]=z[m.z]||{t:0,a:0,ms:[]}).ms.push(m.id)});an.forEach(a=>{const o=z[mn(a.m).z];o.t++;if(open(a))o.a++});return z},
 edificioMasAnomalias(){const l=Object.entries(ASIS.zonas()).sort((a,b)=>b[1].t-a[1].t||b[1].a-a[1].a);if(!l[0][1].t)return 'Actualmente no hay anomalías registradas en ningún edificio.';
  const top=l.filter(x=>x[1].t===l[0][1].t&&x[1].a===l[0][1].a);
  return `Conforme a los datos disponibles, ${top.length>1?'los edificios con más anomalías son':'el edificio con más anomalías es'} ${top.map(x=>x[0]).join(' y ')}, con ${nA(l[0][1].t)} registrada(s), de las cuales ${l[0][1].a} permanece(n) abierta(s).\n\nDetalle por zona:\n`+l.map(x=>`• ${x[0]}: ${x[1].t} en total, ${x[1].a} abierta(s) (${x[1].ms.join(', ')})`).join('\n')},
 medidorMasAnomalias(){const l=med.map(m=>({m,t:an.filter(a=>a.m===m.id).length,a:an.filter(a=>a.m===m.id&&open(a)).length})).sort((a,b)=>b.t-a.t||b.a-a.a),top=l.filter(x=>x.t===l[0].t&&x.a===l[0].a);
  return `El medidor con más anomalías registradas ${top.length>1?'son':'es'} ${top.map(x=>`${x.m.id} (${x.m.n})`).join(' y ')}, con ${nA(l[0].t)}, ${l[0].a} abierta(s).\n\nDetalle:\n`+l.map(x=>`• ${x.m.id}: ${x.t} en total, ${x.a} abierta(s)`).join('\n')},
 trabajadorMasPendientes(){const l=tr.map(t=>({t,n:ld(t)})).sort((a,b)=>b.n-a.n||a.t.id-b.t.id),sin=an.filter(a=>open(a)&&!a.t).length,det=l.map(x=>`• ${x.t.n}: ${x.n} caso(s) pendiente(s)`).join('\n')+(sin?`\n• Sin asignar: ${sin} caso(s)`:'');
  if(!l[0].n)return `Actualmente ningún trabajador tiene casos pendientes.${sin?` Existen ${sin} caso(s) sin asignar.`:''}`;
  const top=l.filter(x=>x.n===l[0].n);return `${top.length>1?'Los trabajadores con más casos pendientes son':'El trabajador con más casos pendientes es'} ${top.map(x=>x.t.n).join(' y ')}, con ${l[0].n} caso(s) abierto(s) ${top.length>1?'cada uno':''}.\n\nDetalle:\n${det}`},
 trabajadorPorNombre(n){const t=tr.find(x=>n.includes(x.n.split(' ')[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))||n.includes(x.n.split(' ')[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));if(!t)return null;
  const mis=an.filter(a=>a.t===t.id&&open(a));return `${t.n}: ${!t.on?'no disponible':av(t)?'disponible en este momento':'fuera de turno'} (turno de ${t.d}:00 a ${t.h}:00). Tiene ${mis.length} caso(s) abierto(s)${mis.length?':\n'+mis.map(a=>`• Anomalía ${a.id} · ${a.m} · prioridad ${a.p.toLowerCase()} · ${a.e}`).join('\n'):'.'}`},
 trabajadoresDisponibles(){const d=tr.filter(av);return d.length?`En este momento ${d.length===1?'está disponible':'están disponibles'}: ${d.map(t=>`${t.n} (turno ${t.d}:00 a ${t.h}:00, ${ld(t)} caso(s))`).join('; ')}.`:'En este momento no hay trabajadores disponibles dentro de su turno.'},
 anomaliasAbiertas(){const o=an.filter(open),c=p=>o.filter(a=>a.p===p).length,e=s=>o.filter(a=>a.e===s).length;return `Hay ${o.length} anomalía(s) abierta(s): ${c('Alta')} de prioridad alta, ${c('Media')} media y ${c('Baja')} baja.\nPor estado: ${e('Detectada')} detectada(s), ${e('Asignada')} asignada(s) y ${e('En atención')} en atención.`},
 prioridadAlta(){const o=an.filter(a=>open(a)&&a.p==='Alta');return o.length?`Hay ${o.length} anomalía(s) abierta(s) de prioridad alta:\n`+o.map(a=>`• N.° ${a.id} · ${a.m} · ${a.e} · ${wk(a.t)}`).join('\n'):'No hay anomalías abiertas de prioridad alta.'},
 sinAsignar(){const s=an.filter(a=>a.e==='Detectada'),v=s.filter(venc);return s.length?`Hay ${s.length} anomalía(s) detectada(s) sin atender, de las cuales ${v.length} está(n) vencida(s):\n`+s.map(a=>`• N.° ${a.id} · ${a.m} · prioridad ${a.p.toLowerCase()}${venc(a)?' · vencida':''}`).join('\n'):'No hay anomalías pendientes de asignación.'},
 medidoresEnFalla(){const f=med.filter(m=>m.f);return f.length?`${f.length} de ${med.length} medidores presenta(n) falla activa:\n`+f.map(m=>`• ${m.id} · ${m.n} (${m.z}): ${an.filter(a=>a.m===m.id&&open(a)).length} anomalía(s) abierta(s)`).join('\n'):'Ningún medidor presenta fallas activas.'},
 listaMedidores(){return `La plataforma monitorea ${med.length} medidores:\n`+med.map(m=>`• ${m.id} · ${m.n} (${m.z}): ${m.f?'en falla':'normal'}, ${L(m.l)} L hoy`).join('\n')},
 estadoMedidor(n){const k=(n.match(/med-?([0-9]{3})/)||[])[1],m=k&&mn('MED-'+k);if(!m)return null;const oa=an.filter(a=>a.m===m.id&&open(a));
  return `${m.id} · ${m.n} (${m.z}): ${m.f?'en falla':'funcionamiento normal'}. Consumo de hoy: ${L(m.l)} L. Anomalías abiertas: ${oa.length}${oa.length?':\n'+oa.map(a=>`• N.° ${a.id} · prioridad ${a.p.toLowerCase()} · ${a.e} · ${wk(a.t)}`).join('\n'):'.'}`},
 medidorMayorConsumo(){const l=[...med].sort((a,b)=>b.l-a.l);return `El medidor con mayor consumo hoy es ${l[0].id} (${l[0].n}), con ${L(l[0].l)} L.\n\nRanking:\n`+l.map((m,i)=>`${i+1}. ${m.id}: ${L(m.l)} L`).join('\n')},
 consumoTotal(){const t=med.reduce((s,m)=>s+m.l,0);return `El consumo acumulado de hoy en los ${med.length} medidores es de ${L(t)} L.`},
 tiempoAtencion(){const a=S.res.reduce((x,y)=>x+y,0)/S.res.length;return `El tiempo medio de atención de la muestra simulada es de ${a.toFixed(1).replace('.',',')} horas.`},
 resumenGeneral(){const o=an.filter(open),t=med.reduce((s,m)=>s+m.l,0),f=med.filter(m=>m.f).length,sin=an.filter(a=>a.e==='Detectada').length;
  return `Resumen general:\n• Consumo de hoy: ${L(t)} L.\n• Anomalías abiertas: ${o.length} (${o.filter(a=>a.p==='Alta').length} de prioridad alta).\n• Medidores con falla activa: ${f} de ${med.length}.\n• Anomalías sin asignar: ${sin}.\n• Trabajadores disponibles ahora: ${tr.filter(av).length} de ${tr.length}.`}
};
function asisResponder(q){
 const K=window.ASISTENTE_KB;
 if(!K)return{t:'No se encontró la base de conocimiento (asistente-base.js). Verifique que el archivo esté en la misma carpeta que index.html.',e:'Fuera de Alcance',f:'N/A'};
 const n=NR(q),rx=l=>new RegExp(l.join('|'));
 if(rx(K.bloqueo.jailbreak).test(n))return{t:K.mensajes.jailbreak,e:'Intento de Jailbreak',f:'N/A'};
 if(rx(K.bloqueo.knowhow).test(n))return{t:K.mensajes.knowhow,e:'Fuera de Alcance',f:'N/A'};
 // Las cien preguntas propuestas tienen prioridad sobre las coincidencias amplias por palabras clave.
 const exact=(K.preguntasFrecuentes||[]).find(x=>NR(x.pregunta)===n);
 if(exact&&typeof ASIS[exact.fn]==='function'){
  try{const t=ASIS[exact.fn](n);if(t)return{t,e:'Éxito',f:exact.fuente}}catch(_e){}
 }
 let best=null,bs=0;
 for(const en of K.entradas){let score=0,ok=true;for(const g of en.g){if(new RegExp(g).test(n))score++;else{ok=false;break}}if(ok){score+=en.p||0;if(score>bs){bs=score;best=en}}}
 if(best){let t;try{t=best.fn?(ASIS[best.fn]?ASIS[best.fn](n):null):best.r}catch(_e){t=null}if(t)return{t,e:'Éxito',f:best.fuente}}
 return{t:K.mensajes.fuera,e:'Fuera de Alcance',f:'N/A'};
}
// Consultas adicionales: solo leen el estado simulado que ya maneja la plataforma.
ASIS.medidorMenorConsumo=()=>{const l=[...med].sort((a,b)=>a.l-b.l);return `El medidor con menor consumo registrado hoy es ${l[0].id} (${l[0].n}), con ${L(l[0].l)} L.`};
ASIS.promedioConsumo=()=>`El promedio de consumo acumulado hoy por medidor es de ${L(med.reduce((s,m)=>s+m.l,0)/med.length)} L en los ${med.length} medidores simulados.`;
ASIS.medidoresNormales=()=>{const l=med.filter(m=>!an.some(a=>a.m===m.id&&open(a)));return l.length?`${l.length} medidor(es) sin anomalías abiertas: ${l.map(m=>`${m.id} (${m.n})`).join('; ')}.`:'Todos los medidores tienen al menos una anomalía abierta.'};
ASIS.anomaliasResueltas=()=>{const l=an.filter(a=>a.e==='Resuelta').sort((a,b)=>(b.h.Resuelta||b.at)-(a.h.Resuelta||a.at));return l.length?`Hay ${l.length} anomalía(s) resuelta(s) en el registro simulado:\n`+l.map(a=>`• N.° ${a.id} · ${a.m} · ${wk(a.t)}`).join('\n'):'No hay anomalías resueltas en el registro.'};
ASIS.listaPrioridad=p=>{const l=an.filter(a=>open(a)&&a.p===p);return l.length?`Hay ${l.length} anomalía(s) abierta(s) de prioridad ${p.toLowerCase()}:\n`+l.map(a=>`• N.° ${a.id} · ${a.m} · ${a.e} · ${wk(a.t)}`).join('\n'):`No hay anomalías abiertas de prioridad ${p.toLowerCase()}.`};
ASIS.prioridadMedia=()=>ASIS.listaPrioridad('Media');
ASIS.prioridadBaja=()=>ASIS.listaPrioridad('Baja');
ASIS.enAtencion=()=>{const l=an.filter(a=>a.e==='En atención');return l.length?`${l.length} caso(s) en atención:\n`+l.map(a=>`• N.° ${a.id} · ${a.m} · ${wk(a.t)}`).join('\n'):'No hay anomalías en atención.'};
ASIS.asignadas=()=>{const l=an.filter(a=>a.e==='Asignada');return l.length?`${l.length} caso(s) asignado(s), pendiente(s) de iniciar atención:\n`+l.map(a=>`• N.° ${a.id} · ${a.m} · ${wk(a.t)}`).join('\n'):'No hay anomalías en estado Asignada.'};
ASIS.trabajadoresLista=()=>`Se registran ${tr.length} trabajadores en la simulación:\n`+tr.map(t=>`• ${t.n}: turno ${t.d}:00 a ${t.h}:00; ${t.on?'activo':'no disponible'}; ${ld(t)} caso(s) abierto(s)`).join('\n');
ASIS.anomaliaReciente=()=>{const a=[...an].sort((a,b)=>b.at-a.at)[0];return a?`La anomalía más reciente es la N.° ${a.id}, del medidor ${a.m}, detectada ${F(a.at)}. Prioridad ${a.p}, estado ${a.e}.`:'No hay anomalías registradas.'};
ASIS.anomaliaAntigua=()=>{const a=an.filter(open).sort((a,b)=>a.at-b.at)[0];return a?`La anomalía abierta más antigua es la N.° ${a.id} (${a.m}), detectada ${F(a.at)}, en estado ${a.e}, prioridad ${a.p}.`:'No hay anomalías abiertas.'};
ASIS.estadisticasEstados=()=>`Distribución de los ${an.length} registros simulados:\n`+['Detectada','Asignada','En atención','Resuelta'].map(e=>`• ${e}: ${an.filter(a=>a.e===e).length}`).join('\n');
const msgHTML=m=>m.r==='u'?`<div class="cu">${esc(m.t)}</div>`:`<div class="cb"><div class="tx">${esc(m.t)}${m.e==='Éxito'&&m.f&&m.f!=='N/A'?`\n\nFuente: ${esc(m.f)}`:''}</div><hr><div class="au"><b>Registro de Auditoría Interna:</b><br>• Estado: ${esc(m.e)}<br>• Fuente consultada: ${esc(m.f)}</div></div>`;
function chatInit(){if(!S.ch){const b=asisResponder('hola');S.ch=[{r:'b',t:b.t,e:b.e,f:b.f,at:Date.now()}]}}
let chatTimer=null;
function dibujarChat(){const cm=$('#cm');if(cm){cm.innerHTML=S.ch.map(msgHTML).join('')+(S.chatEsperando?'<div class="chat-wait" role="status"><span>El asistente está escribiendo</span><span class="chat-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>':'');cm.scrollTop=cm.scrollHeight}}
V.Asistente=()=>{chatInit();const K=window.ASISTENTE_KB||{},sg=K.sugerencias||[],total=(K.preguntasFrecuentes||[]).length;
return `<h1>Asistente inteligente</h1><div class="c chat"><div class="chat-tools"><p style="font-size:13px;color:var(--mu);margin:0">Asistente local basado en reglas · ${total} preguntas sugeridas · Datos de demostración</p><button class="b" data-a="chatpdf" ${S.ch.length?'':'disabled'}>Descargar informe PDF</button></div><div class="cm" id="cm" aria-live="polite">${S.ch.map(msgHTML).join('')}${S.chatEsperando?'<div class="chat-wait" role="status"><span>El asistente está escribiendo</span><span class="chat-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>':''}</div><div class="chips">${sg.map(s=>`<button class="b" data-a="chip">${esc(s)}</button>`).join('')}</div><div class="cin"><input id="ci" placeholder="Pregunte sobre medidores, consumo, anomalías o trabajadores…" autocomplete="off" aria-label="Consulta al asistente" ${S.chatEsperando?'disabled':''}><button class="b p" data-a="chat" ${S.chatEsperando?'disabled':''}>Enviar</button></div><div class="chat-tools"><button class="b" data-a="chatclr">Limpiar conversación</button><small style="color:var(--mu)">El informe incluye fecha, preguntas, respuestas y fuentes.</small></div></div>`};
function asisEnviar(q){q=String(q||'').trim();if(!q||S.chatEsperando)return;chatInit();S.ch.push({r:'u',t:q,at:Date.now()});S.chatEsperando=true;const ci=$('#ci');if(ci)ci.value='';if(S.v==='Asistente')render();dibujarChat();
 chatTimer=setTimeout(()=>{chatTimer=null;const r=asisResponder(q);S.ch.push({r:'b',t:r.t,e:r.e,f:r.f,at:Date.now()});S.chatEsperando=false;if(S.v==='Asistente'){render();dibujarChat();const i=$('#ci');if(i)i.focus()}},3000);
}
function limpiarChat(){if(chatTimer)clearTimeout(chatTimer);chatTimer=null;S.chatEsperando=false;S.ch=null;if(S.v==='Asistente')render()}
// Generador PDF A4 autónomo: sin bibliotecas, CDN, servicio externo ni llamadas a API.
function generarPDFLocal(){chatInit();const fecha=new Date().toLocaleString('es-CO');const lineas=[
 'PLATAFORMA HIDRICA - INFORME DEL ASISTENTE',
 'Universidad Central | Prototipo de datos simulados',
 'Generado: '+fecha,
 'Conversacion y fuentes consultadas',
 '------------------------------------------------------------'
 ];
 S.ch.forEach((m,i)=>{lineas.push('');lineas.push((m.r==='u'?'PREGUNTA':'RESPUESTA')+' '+(i+1)+' - '+new Date(m.at||Date.now()).toLocaleString('es-CO'));lineas.push(...String(m.t).split(/\n/));if(m.r!=='u'){lineas.push('Estado de auditoria: '+(m.e||'N/A'));lineas.push('Fuente: '+(m.f||'N/A'));}});

 // Helvetica /WinAnsiEncoding; convertir caracteres incompatibles sin romper el PDF.
 const latin=s=>String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/[\u2022]/g,'-').replace(/[^\x00-\xff]/g,'?');
 const wrap=(str,max=92)=>{const out=[];for(const raw of str.split('\n')){let t=latin(raw);if(!t){out.push('');continue}while(t.length>max){let j=t.lastIndexOf(' ',max);if(j<24)j=max;out.push(t.slice(0,j));t=t.slice(j).trimStart()}out.push(t)}return out};
 const all=lineas.flatMap(l=>wrap(l)),per=48,pages=[];for(let i=0;i<all.length;i+=per)pages.push(all.slice(i,i+per));if(!pages.length)pages.push([]);
 const escpdf=t=>latin(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');
 const objects=[''];const add=t=>{objects.push(t);return objects.length-1};const fontId=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 const rootId=add('');const kids=[];
 pages.forEach((lines,i)=>{let stream='BT /F1 10 Tf 46 795 Td 14 TL\n';lines.forEach((l,j)=>{stream+=`(${escpdf(l)}) Tj T*\n`});stream+='ET\n';const cId=add(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);const pId=add(`<< /Type /Page /Parent ${rootId} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${cId} 0 R >>`);kids.push(pId)});
 objects[rootId]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
 const catalog=add(`<< /Type /Catalog /Pages ${rootId} 0 R >>`);
 let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`}
 const start=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`;
 const bytes=Uint8Array.from(pdf,c=>c.charCodeAt(0)&255),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download='Informe_Asistente_Hidrico_'+new Date().toISOString().slice(0,10)+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a="chat"],[data-a="chip"],[data-a="chatclr"],[data-a="chatpdf"],[data-a="pregunta"]');if(!t)return;
 if(t.dataset.a==='chat')asisEnviar($('#ci')?.value);else if(t.dataset.a==='chip')asisEnviar(t.textContent);else if(t.dataset.a==='pregunta'){const q=window.ASISTENTE_KB?.preguntasFrecuentes?.[+t.dataset.index];if(q)asisEnviar(q.pregunta)}else if(t.dataset.a==='chatclr')limpiarChat();else if(t.dataset.a==='chatpdf')generarPDFLocal()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci'){e.preventDefault();asisEnviar(e.target.value)}});
</script>
</body>
